<!doctype html>
<html lang="de" data-theme="luxe">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f4ed" />
    <meta name="color-scheme" content="light only" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Dein persönlicher Kleiderschrank. Lokal, privat und immer bei dir."
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%BASE_URL%apple-touch-icon-monochrome.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="%BASE_URL%icon-monochrome-192.png"
    />
    <title>MyStyle · Dein persönlicher Kleiderschrank</title>
  </head>
  <body>
    <!-- Gives icons and sketches a slight hand-drawn wobble (src/theme.css). -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="hand-drawn" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.05"
          numOctaves="2"
          seed="7"
        />
        <feDisplacementMap
          in="SourceGraphic"
          scale="2.2"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
